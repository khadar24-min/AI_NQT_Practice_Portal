<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | PrepAI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<style>

#emailMsg,
#passwordMsg,
#confirmMsg{
font-weight:600;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="/">
PrepAI
</a>

<div class="ms-auto">

<a href="/" class="btn btn-outline-light me-2">
Home
</a>

<a href="/login" class="btn btn-primary">
Login
</a>

</div>

</div>

</nav>

<div class="container">

<div class="form-container">

<h2 class="form-title">

Create Account

</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category,message in messages %}

<div class="alert alert-{{category}} alert-dismissible fade show">

{{message}}

<button class="btn-close" data-bs-dismiss="alert"></button>

</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Enter Full Name"
required>

</div>

<div class="mb-3">

<label class="form-label">

Gmail Address

</label>

<div class="input-group">

<input
type="email"
id="email"
name="email"
class="form-control"
placeholder="Enter Gmail Address"
required>

<button
type="button"
class="btn btn-primary"
id="sendOtpBtn">

Send OTP

</button>

</div>

<small id="emailMsg"></small>

</div>

<div class="mb-3">

<label class="form-label">

Enter OTP

</label>

<input
type="text"
name="otp"
class="form-control"
placeholder="Enter OTP"
maxlength="6"
required>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
id="password"
name="password"
class="form-control"
placeholder="Create Password"
required>

<small id="passwordMsg"></small>

</div>

<div class="mb-3">

<label class="form-label">

Confirm Password

</label>

<input
type="password"
id="confirmPassword"
name="confirm_password"
class="form-control"
placeholder="Confirm Password"
required>

<small id="confirmMsg"></small>

</div>

<button
type="submit"
class="btn btn-primary w-100">

Create Account

</button>

</form>

<div class="text-center mt-4">

Already have an account?

<a href="/login">

Login Here

</a>

</div>

</div>

</div>
<script>

const email = document.getElementById("email");
const emailMsg = document.getElementById("emailMsg");

email.addEventListener("input", function () {

    const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

    if (gmailRegex.test(email.value)) {
        emailMsg.innerHTML = "✅ Valid Gmail Address";
        emailMsg.style.color = "green";
    } else {
        emailMsg.innerHTML = "❌ Enter a valid Gmail address";
        emailMsg.style.color = "red";
    }

});

const password = document.getElementById("password");
const passwordMsg = document.getElementById("passwordMsg");

password.addEventListener("blur", function () {

    const value = password.value;

    if (value.length === 0) {
        passwordMsg.innerHTML = "";
        return;
    }

    const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

    if (regex.test(value)) {

        passwordMsg.innerHTML = "✅ Strong Password";
        passwordMsg.style.color = "green";

    } else {

        passwordMsg.innerHTML =
            "❌ Password must contain:<br>" +
            "• Minimum 8 characters<br>" +
            "• One Uppercase Letter<br>" +
            "• One Lowercase Letter<br>" +
            "• One Number<br>" +
            "• One Special Character";

        passwordMsg.style.color = "red";

    }

});

const confirmPassword = document.getElementById("confirmPassword");
const confirmMsg = document.getElementById("confirmMsg");

confirmPassword.addEventListener("input", function () {

    if (confirmPassword.value.length === 0) {
        confirmMsg.innerHTML = "";
        return;
    }

    if (password.value === confirmPassword.value) {

        confirmMsg.innerHTML = "✅ Password Matched";
        confirmMsg.style.color = "green";

    } else {

        confirmMsg.innerHTML = "❌ Password Doesn't Match";
        confirmMsg.style.color = "red";

    }

});
document.getElementById("sendOtpBtn").addEventListener("click", function () {

    const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

    if (!gmailRegex.test(email.value)) {

        alert("Please enter a valid Gmail address.");

        return;

    }

    fetch("/send_otp", {

        method: "POST",

        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },

        body: "email=" + encodeURIComponent(email.value)

    })

    .then(response => response.json())

    .then(data => {

        if (data.status === "success") {

            alert("OTP has been sent successfully.");

        } else {

            alert(data.message);

        }

    })

    .catch(error => {

        alert("Failed to send OTP.");

        console.log(error);

    });

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
