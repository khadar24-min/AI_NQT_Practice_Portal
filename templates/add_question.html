<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Question | PrepAI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand fw-bold" href="/admin/dashboard">

PrepAI Admin

</a>

<div class="ms-auto">

<a href="/admin/dashboard" class="btn btn-outline-light me-2">

Dashboard

</a>

<a href="/logout" class="btn btn-danger">

Logout

</a>

</div>

</div>

</nav>

<section class="dashboard-header">

<div class="container">

<h2>

Add Question

</h2>

<p>

Create placement questions.

</p>

</div>

</section>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="dashboard-card">

<form method="POST">

<div class="mb-3">

<label class="form-label">

Section

</label>

<select class="form-select" name="section_id" required>

{% for section in sections %}

<option value="{{ section.id }}">

{{ section.section_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

Question

</label>

<textarea class="form-control"

name="question"

rows="4"

required></textarea>

</div>

<div class="mb-3">

<label>

Option A

</label>

<input

type="text"

class="form-control"

name="option_a"

required>

</div>

<div class="mb-3">

<label>

Option B

</label>

<input

type="text"

class="form-control"

name="option_b"

required>

</div>

<div class="mb-3">

<label>

Option C

</label>

<input

type="text"

class="form-control"

name="option_c"

required>

</div>

<div class="mb-3">

<label>

Option D

</label>

<input

type="text"

class="form-control"

name="option_d"

required>

</div>

<div class="mb-3">

<label>

Correct Answer

</label>

<select class="form-select"

name="answer">

<option>A</option>

<option>B</option>

<option>C</option>

<option>D</option>

</select>

</div>

<div class="mb-3">

<label>

Explanation

</label>

<textarea

class="form-control"

name="explanation"

rows="3">

</textarea>

</div>

<div class="mb-3">

<label>

Difficulty

</label>

<select

class="form-select"

name="difficulty">

<option>Easy</option>

<option>Medium</option>

<option>Hard</option>

</select>

</div>

<button

class="btn btn-success w-100">

Save Question

</button>

</form>

</div>

</div>

</div>

</div>

<footer class="bg-dark text-white text-center py-4">

© 2026 PrepAI

</footer>

</body>

</html>
