<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Question | PrepAI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand fw-bold" href="/admin/dashboard">
PrepAI Admin
</a>

<div class="ms-auto">
<a href="/admin/questions" class="btn btn-outline-light me-2">
Back
</a>

<a href="/logout" class="btn btn-danger">
Logout
</a>
</div>

</div>
</nav>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow p-4">

<h3 class="mb-4">
Edit Question
</h3>

<form method="POST">

<div class="mb-3">
<label class="form-label">Section</label>

<select class="form-select" name="section_id">

{% for section in sections %}

<option value="{{ section.id }}"
{% if section.id == question.section_id %}selected{% endif %}>

{{ section.section_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">
Question
</label>

<textarea
class="form-control"
name="question"
rows="4"
required>{{ question.question }}</textarea>

</div>

<div class="mb-3">

<label>Option A</label>

<input
type="text"
class="form-control"
name="option_a"
value="{{ question.option_a }}"
required>

</div>

<div class="mb-3">

<label>Option B</label>

<input
type="text"
class="form-control"
name="option_b"
value="{{ question.option_b }}"
required>

</div>

<div class="mb-3">

<label>Option C</label>

<input
type="text"
class="form-control"
name="option_c"
value="{{ question.option_c }}"
required>

</div>

<div class="mb-3">

<label>Option D</label>

<input
type="text"
class="form-control"
name="option_d"
value="{{ question.option_d }}"
required>

</div>

<div class="mb-3">

<label>Correct Answer</label>

<select class="form-select" name="answer">

<option value="A" {% if question.answer=="A" %}selected{% endif %}>A</option>

<option value="B" {% if question.answer=="B" %}selected{% endif %}>B</option>

<option value="C" {% if question.answer=="C" %}selected{% endif %}>C</option>

<option value="D" {% if question.answer=="D" %}selected{% endif %}>D</option>

</select>

</div>

<div class="mb-3">

<label>Explanation</label>

<textarea
class="form-control"
name="explanation"
rows="3">{{ question.explanation }}</textarea>

</div>

<div class="mb-3">

<label>Difficulty</label>

<select class="form-select" name="difficulty">

<option value="Easy" {% if question.difficulty=="Easy" %}selected{% endif %}>Easy</option>

<option value="Medium" {% if question.difficulty=="Medium" %}selected{% endif %}>Medium</option>

<option value="Hard" {% if question.difficulty=="Hard" %}selected{% endif %}>Hard</option>

</select>

</div>

<button class="btn btn-primary w-100">
Update Question
</button>

</form>

</div>

</div>

</div>

</div>

</body>
</html>
