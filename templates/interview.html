<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrepAI AI Interview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/workspace.css') }}">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            🤖 PrepAI AI Interview
        </span>

        <span class="text-white">
            {{ company }} | {{ role }}
        </span>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                AI Interview Session
            </h3>

        </div>

        <div class="card-body">

            <!-- Progress Bar -->

            <div class="mb-4">

                <h6 class="mb-2">
                    Interview Progress
                </h6>

                <div class="progress" style="height:25px;">

                    <div class="progress-bar progress-bar-striped progress-bar-animated"
                         role="progressbar"
                         style="width: {{ question_no * 10 }}%;">

                        {{ question_no }}/10

                    </div>

                </div>

            </div>

            <!-- Interview Details -->

            <div class="alert alert-info">

                <strong>Company:</strong> {{ company }}

                <br>

                <strong>Role:</strong> {{ role }}

                <br>

                <strong>Difficulty:</strong> {{ difficulty }}

                <br>

                <strong>Interview Type:</strong> {{ mode }}

            </div>

            <hr>

            <h5 class="text-end text-primary">

                Question {{ question_no }} of 10

            </h5>

            <h4 class="mb-3">

                Interview Question

            </h4>

            <div class="alert alert-warning fs-5">

                {{ question }}

            </div>

            <form action="{{ url_for('submit_answer') }}" method="POST">

                <input type="hidden" name="question" value="{{ question }}">

                <div class="mb-3">

                    <label class="form-label">

                        Your Answer

                    </label>

                    <textarea
                        name="answer"
                        rows="8"
                        class="form-control"
                        placeholder="Type your answer here..."
                        required></textarea>

                </div>

                <button
                    id="submitBtn"
                    type="submit"
                    class="btn btn-success btn-lg w-100">

                    Submit Answer

                </button>

            </form>

        </div>

    </div>

</div>

<script>

document.querySelector("form").addEventListener("submit", function () {

    const btn = document.getElementById("submitBtn");

    btn.disabled = true;

    btn.innerHTML = "🤖 AI is generating the next question...";

});

</script>

</body>

</html>
