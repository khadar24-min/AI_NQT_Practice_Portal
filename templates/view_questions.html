<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View Questions | PrepAI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand fw-bold" href="/admin/dashboard">

PrepAI Admin

</a>

<div class="ms-auto">

<a href="/admin/dashboard" class="btn btn-outline-light me-2">

Dashboard

</a>

<a href="/logout" class="btn btn-danger">

Logout

</a>

</div>

</div>

</nav>

<div class="container py-5">

<h2 class="mb-4">

All Questions

</h2>

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Section</th>

<th>Question</th>

<th>Answer</th>

<th>Difficulty</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

{% for question in questions %}

<tr>

<td>{{ question.id }}</td>

<td>{{ question.section.section_name }}</td>

<td>{{ question.question }}</td>

<td>{{ question.answer }}</td>

<td>{{ question.difficulty }}</td>

<td>

<a href="/admin/edit_question/{{ question.id }}" class="btn btn-warning btn-sm">

Edit

</a>

<a href="/admin/delete_question/{{ question.id }}" class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>

</html>
