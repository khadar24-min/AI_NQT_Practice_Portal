<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrepAI AI Interview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/workspace.css') }}">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
            🤖 PrepAI
        </a>

        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light">
            Dashboard
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h2>🤖 AI Interview Assistant</h2>

        </div>

        <div class="card-body">

            <form action="{{ url_for('start_interview') }}" method="POST">

                <div class="mb-3">

                    <label class="form-label">Choose Company</label>

                    <select name="company" class="form-select">

                        <option>TCS</option>
                        <option>Infosys</option>
                        <option>Wipro</option>
                        <option>Accenture</option>
                        <option>Capgemini</option>
                        <option>Amazon</option>
                        <option>Google</option>
                        <option>Microsoft</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">Job Role</label>

                    <select name="role" class="form-select">

                        <option>Software Engineer</option>
                        <option>Python Developer</option>
                        <option>Java Developer</option>
                        <option>Frontend Developer</option>
                        <option>Flutter Developer</option>
                        <option>Data Analyst</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">Difficulty</label>

                    <select name="difficulty" class="form-select">

                        <option>Easy</option>
                        <option>Medium</option>
                        <option>Hard</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">Interview Mode</label>

                    <select name="mode" class="form-select">

                        <option>Text</option>
                        <option>Voice (Coming Soon)</option>

                    </select>

                </div>

                <button class="btn btn-success btn-lg w-100">

                    🚀 Start AI Interview

                </button>

            </form>
            <a href="{{ url_for('interview_history') }}"
                class="btn btn-primary">
                Interview History
            </a>

            <a href="{{ url_for('resume_analyzer') }}"
                class="btn btn-success">
                AI Resume Analyzer
            </a>

        </div>

    </div>

</div>

</body>
</html>
