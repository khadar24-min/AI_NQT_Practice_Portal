<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Section | PrepAI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand fw-bold" href="/admin/dashboard">

PrepAI Admin

</a>

<div class="ms-auto">

<a href="/admin/dashboard" class="btn btn-outline-light me-2">

Dashboard

</a>

<a href="/logout" class="btn btn-danger">

Logout

</a>

</div>

</div>

</nav>

<section class="dashboard-header">

<div class="container">

<h2>

Add Section

</h2>

<p>

Create sections for a paper.

</p>

</div>

</section>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="dashboard-card">

<h3 class="mb-4">

Section Details

</h3>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Paper

</label>

<select name="paper_id" class="form-select" required>

{% for paper in papers %}

<option value="{{ paper.id }}">

{{ paper.company.company_name }} - {{ paper.year }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

Section Name

</label>

<input
type="text"
name="section_name"
class="form-control"
placeholder="Example: Numerical Ability"
required>

</div>

<button
type="submit"
class="btn btn-primary w-100">

Save Section

</button>

</form>

</div>

</div>

</div>

</div>

<footer class="bg-dark text-white text-center py-4">

© 2026 PrepAI Admin

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
