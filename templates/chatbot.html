<!DOCTYPE html>
<html>
<head>

<title>PrepAI Assistant</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">
🤖 PrepAI Assistant
</h2>

<form method="POST">

<textarea
name="question"
class="form-control"
rows="4"
placeholder="Ask any placement related question..."
required></textarea>

<br>

<button class="btn btn-primary">
Ask AI
</button>

</form>

{% if answer %}

<div class="card mt-4">

<div class="card-header bg-primary text-white">
AI Response
</div>

<div class="card-body">

<p><strong>Your Question:</strong></p>

<p>{{ question }}</p>

<hr>

<pre style="white-space:pre-wrap;">
{{ answer }}
</pre>

</div>

</div>

{% endif %}

</div>

</body>
</html>
